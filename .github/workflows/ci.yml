name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Aspleo.Cqrs.slnx
      - run: dotnet build Aspleo.Cqrs.slnx -c Release --no-restore
      - run: dotnet test Aspleo.Cqrs.slnx -c Release --no-build
      - shell: pwsh
        run: ./scripts/Verify-Packages.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/**/*.nupkg
